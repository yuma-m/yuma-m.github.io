baseURL = "https://yuma.cloud/"
defaultContentLanguage = "ja"
title = "Yuma Mihira"
theme = "anatole"
summarylength = 10
enableEmoji = true
enableRobotsTXT = true
ignoreLogs = ["warning-goldmark-raw-html"]


[languages.ja]
label = "日本語"
locale = "ja-jp"
weight = 1

[languages.en]
label = "English"
locale = "en-us"
weight = 2
# Only Works and About are translated; other en pages are not rendered
disableKinds = ["404"]

[markup.highlight]
  noClasses = false
  codeFences = true
  guessSyntax = true

[services]
  [services.disqus]
  shortname = "yuma-m"
  [services.googleAnalytics]
  id = "G-7YP6BJWVK9"

[permalinks]
post = "/:section/:year/:month/:day/:filename/"

[params]
title = "Yuma Mihira"
author = "Yuma Mihira"
description = "Robotics Software Engineer"
profilePicture = "images/yuma-m.jpg"
keywords = ""
favicon = "favicons/"
mainSections = ["post"]
images = ["images/yuma-m.jpg"]
doNotLoadAnimations = true
indexDateFormat = "2006/01/02"
listDateFormat = "2006/01/02"
singleDateFormat = "2006/01/02"
reversepagetitle = true

# Sub-sites hosted under this domain by other GitHub Pages repositories
extraSitemapPaths = ["rust-training/", "moq-training/", "moqros/"]
extraSitemapIndexes = ["rust-training/sitemap.xml", "moq-training/sitemap.xml"]

# Google Site Verify
googleSiteVerify = "googlee2a23a0ca75554a9"

